
# GitLab CI/CD — SonarQube Static Analysis
# Automated source analysis and Quality Gate evaluation

stages:
  - validate
  - analyze

variables:
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  GIT_DEPTH: "0"
  SONAR_PROJECT_KEY: "infrastructure-automation-demo"

validate:
  stage: validate
  image: alpine:3.20
  script:
    - test -f docker/index.html
    - test -f docker/Dockerfile
    - echo "Project validation completed."

sonarqube-analysis:
  stage: analyze
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
  script:
    - test -n "$SONAR_HOST_URL"
    - test -n "$SONAR_TOKEN"
    - sonar-scanner
        -Dsonar.projectKey="${SONAR_PROJECT_KEY}"
        -Dsonar.projectName="Infrastructure Automation Demo"
        -Dsonar.sources="docker"
        -Dsonar.qualitygate.wait=true
  rules:
    - if: '$CI_COMMIT_BRANCH'
