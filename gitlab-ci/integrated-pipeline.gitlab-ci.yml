
# Integrated GitLab CI/CD Pipeline
# SonarQube -> Docker Build -> Nexus Registry
# Project validation, code analysis, container build, and controlled publication

stages:
  - validate
  - analyze
  - build
  - publish

variables:
  GIT_DEPTH: "0"
  SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
  SONAR_PROJECT_KEY: "infrastructure-automation-demo"
  IMAGE_NAME: "infrastructure-demo"

validate-project:
  stage: validate
  image: alpine:3.20
  script:
    - echo "Validating project files..."
    - test -f docker/Dockerfile
    - test -f docker/index.html
    - test -f docker/compose.yaml
    - echo "Validation successful."

sonarqube-analysis:
  stage: analyze
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  script:
    - test -n "$SONAR_HOST_URL"
    - test -n "$SONAR_TOKEN"
    - >-
      sonar-scanner
      -Dsonar.projectKey="${SONAR_PROJECT_KEY}"
      -Dsonar.sources="docker"
      -Dsonar.qualitygate.wait=true

docker-build:
  stage: build
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - docker info
    - >-
      docker build
      -f docker/Dockerfile
      -t "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" .
    - docker image inspect "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"

publish-to-nexus:
  stage: publish
  image: docker:27-cli
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - test -n "$NEXUS_REGISTRY"
    - test -n "$NEXUS_USERNAME"
    - test -n "$NEXUS_PASSWORD"
    - >-
      echo "$NEXUS_PASSWORD" |
      docker login "$NEXUS_REGISTRY"
      --username "$NEXUS_USERNAME"
      --password-stdin
    - >-
      docker build
      -f docker/Dockerfile
      -t "${NEXUS_REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" .
    - >-
      docker push
      "${NEXUS_REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
    - docker logout "$NEXUS_REGISTRY"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
