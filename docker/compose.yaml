
name: infrastructure-automation-lab

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: infrastructure-automation-demo:local
    container_name: infra-demo-web
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:80"

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
