
---
- name: Install and configure Nginx on Debian
  hosts: webservers
  become: true
  gather_facts: true

  tasks:
    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Ensure Nginx is enabled and running
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Verify Nginx is active
      ansible.builtin.command:
        cmd: systemctl is-active nginx
      register: nginx_status
      changed_when: false

    - name: Show Nginx service status
      ansible.builtin.debug:
        msg: "Nginx status: {{ nginx_status.stdout }}"
